<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>佇遮 tī-tsia｜台灣製收集所</title>
    <meta
      name="description"
      content="台灣囡仔、台灣製造，就在這裡——蒐集、查核、標註台灣製商品與品牌，分清楚原料產地與製造地，不是商城，是查核所。"
    />
    <meta name="theme-color" content="#F4C9A8" />
    <script>
      (() => {
        const storageKey = "mitmap-theme";
        const root = document.documentElement;
        let storedTheme;

        try {
          storedTheme = localStorage.getItem(storageKey);
        } catch {
          storedTheme = null;
        }

        const preference = ["system", "light", "dark"].includes(storedTheme)
          ? storedTheme
          : "system";
        const resolved =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;

        root.classList.toggle("dark", resolved === "dark");
        root.dataset.theme = resolved;
        root.dataset.themePreference = preference;
        root.style.colorScheme = resolved;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", resolved === "dark" ? "#1E1614" : "#F4C9A8");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
